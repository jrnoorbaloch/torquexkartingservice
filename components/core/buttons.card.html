<style>body{margin:0;background:var(--color-canvas);font-family:var(--font-sans);padding:28px;}

  .lbl{font-size:11px;color:#666;letter-spacing:1px;text-transform:uppercase;width:100%;margin-bottom:10px;}
</style></head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, Badge, SpecCell } = window.TorqueXDesignSystem_1604c3;
    ReactDOM.createRoot(document.getElementById("root")).render(
      <>
        <div className="grp"><span className="lbl">Buttons</span>

          <Button variant="outline-on-dark">Discover</Button>

          <Badge tone="success">In stock</Badge>
          <Badge tone="warning">Low</Badge>
        </div>
        <div className="grp"><span className="lbl">Spec / race cells</span>
          <SpecCell value="2.85s" label="0–100 km/h" />
          <div style={{width:48}}></div>
          <SpecCell value="P1" label="Italian GP" tone="race" />
        </div>
      </>
    );
