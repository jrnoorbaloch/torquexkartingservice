<!-- @dsCard group="Type" viewport="700x200" name="Labels & numbers" subtitle="Uppercase CTA / nav tracking, and the giant number-display" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-canvas);font-family:var(--font-sans);padding:28px 24px;color:var(--color-ink);display:flex;gap:48px;align-items:flex-end;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;gap:14px;}
  .tag{font-size:11px;color:var(--color-muted);letter-spacing:1px;text-transform:uppercase;}
</style></head>
<body>
  <div class="col">
    <div><div class="tag">button · 14/700/1.4px</div><div style="font-size:14px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;margin-top:6px;">Configure</div></div>
    <div><div class="tag">nav-link · 13/600/0.65px</div><div style="font-size:13px;font-weight:600;letter-spacing:.65px;text-transform:uppercase;margin-top:6px;">Models</div></div>
    <div><div class="tag">caption-uppercase · 11/600</div><div style="font-size:11px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;margin-top:6px;color:var(--color-body)">The Range</div></div>
  </div>
  <div class="col">
    <div class="tag">number-display · 80/700</div>
    <div style="display:flex;align-items:baseline;gap:24px;">
      <span style="font-size:80px;font-weight:700;line-height:1;letter-spacing:-1.6px;">2.85</span>
      <span style="font-size:80px;font-weight:700;line-height:1;letter-spacing:-1.6px;color:var(--color-primary);">P1</span>
    </div>
  </div>
</body></html>
