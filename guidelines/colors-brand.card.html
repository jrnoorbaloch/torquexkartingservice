<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

  .sw{width:160px;height:102px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;}
  .n{font-size:12px;font-weight:600;color:#fff;}

<body>
  <div class="sw" style="background:var(--color-primary)"><div class="n">Primary</div><div class="h">#da291c · Rosso Corsa</div></div>

  <div class="sw" style="background:var(--color-primary-hover)"><div class="n">Primary Hover</div><div class="h">#9d2211 · doc only</div></div>
  <div class="sw" style="background:var(--color-accent-yellow-hypersail)"><div class="n" style="color:#181818">Hypersail</div><div class="h" style="color:rgba(0,0,0,.6)">#fff200 · scoped</div></div>
