<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing ladder" subtitle="Base 4px — named 8px ladder, xxxs → super" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-canvas);font-family:var(--font-sans);padding:28px 24px;color:var(--color-ink);}
  .row{display:flex;align-items:center;gap:16px;margin-bottom:8px;}
  .name{width:130px;flex:none;font-size:12px;color:var(--color-body);}
  .name b{color:#fff;font-weight:600;}
  .bar{height:14px;background:var(--color-primary);}
</style></head>
<body>
  <div class="row"><span class="name"><b>xxxs</b> · 4</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="name"><b>xxs</b> · 8</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="name"><b>xs</b> · 16</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="name"><b>sm</b> · 24</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="name"><b>md</b> · 32</span><span class="bar" style="width:32px"></span></div>
  <div class="row"><span class="name"><b>lg</b> · 48</span><span class="bar" style="width:48px"></span></div>
  <div class="row"><span class="name"><b>xl</b> · 64</span><span class="bar" style="width:64px"></span></div>
  <div class="row"><span class="name"><b>xxl</b> · 96</span><span class="bar" style="width:96px"></span></div>
  <div class="row"><span class="name"><b>super</b> · 128</span><span class="bar" style="width:128px"></span></div>
</body></html>
