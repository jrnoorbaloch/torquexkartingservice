<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-canvas);font-family:var(--font-sans);padding:24px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;}
  .item{display:flex;flex-direction:column;gap:8px;}
  .box{width:150px;height:88px;}
  .l{font-size:11px;color:var(--color-body);}
  .l b{color:#fff;font-weight:600;}
</style></head>
<body>
  <div class="item"><div class="box" style="background:var(--gradient-red)"></div><div class="l"><b>gradient-red</b></div></div>
  <div class="item"><div class="box" style="background:var(--gradient-dark)"></div><div class="l"><b>gradient-dark</b></div></div>
  <div class="item"><div class="box" style="background:var(--color-canvas-elevated);box-shadow:var(--shadow-small);border:1px solid var(--color-hairline)"></div><div class="l"><b>shadow-small</b> · 0 4px 8px</div></div>
</body></html>
