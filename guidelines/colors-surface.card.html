<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Near-black canvas, elevated cards, white editorial bands" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-canvas);font-family:var(--font-sans);display:flex;gap:1px;padding:24px;flex-wrap:wrap;}
  .sw{width:127px;height:102px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;border:1px solid var(--color-hairline);}
  .n{font-size:12px;font-weight:600;}
  .h{font-size:11px;opacity:.7;letter-spacing:.5px;margin-top:2px;}
  .lt{color:#181818;} .dk{color:#fff;}
</style></head>
<body>
  <div class="sw dk" style="background:var(--color-canvas)"><div class="n">Canvas</div><div class="h">#181818</div></div>
  <div class="sw dk" style="background:var(--color-canvas-elevated)"><div class="n">Elevated</div><div class="h">#303030</div></div>
  <div class="sw lt" style="background:var(--color-canvas-light)"><div class="n">Light</div><div class="h">#ffffff</div></div>
  <div class="sw lt" style="background:var(--color-surface-soft-light)"><div class="n">Soft Light</div><div class="h">#f7f7f7</div></div>
  <div class="sw lt" style="background:var(--color-surface-strong-light)"><div class="n">Strong Light</div><div class="h">#ebebeb</div></div>
</body></html>
