<!-- @dsCard group="Type" viewport="700x240" name="Title & body scale" subtitle="Component titles, list labels, running body, captions" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--color-canvas);font-family:var(--font-sans);padding:28px 24px;color:var(--color-ink);}
  .row{display:flex;align-items:baseline;gap:16px;margin-bottom:13px;}
  .tag{font-size:11px;color:var(--color-muted);letter-spacing:1px;text-transform:uppercase;width:150px;flex:none;}
</style></head>
<body>
  <div class="row"><span class="tag">title-md · 18 / 700</span><span style="font-size:18px;font-weight:700;">Component title</span></div>
  <div class="row"><span class="tag">title-sm · 16 / 500</span><span style="font-size:16px;font-weight:500;letter-spacing:.08px;">List label</span></div>
  <div class="row"><span class="tag">body-md · 14 / 400</span><span style="font-size:14px;font-weight:400;color:var(--color-body)">Default running body copy on dark canvas.</span></div>
  <div class="row"><span class="tag">body-sm · 13 / 400</span><span style="font-size:13px;font-weight:400;color:var(--color-body)">Footer body copy.</span></div>
  <div class="row"><span class="tag">caption · 12 / 400</span><span style="font-size:12px;font-weight:400;color:var(--color-muted)">Photo caption.</span></div>
</body></html>
